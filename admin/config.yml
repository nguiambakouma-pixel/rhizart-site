# ============================================
# RHIZART — Decap CMS Config v2
# Architecture JSON : édite projects.json directement
# Authentification via GitHub OAuth
# ============================================

backend:
  name: github
  repo: nguiambakouma-pixel/rhizart-site
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: fr

collections:

  # ============================================
  # PROJETS — édite projects.json directement
  # ============================================
  - name: "projets"
    label: "Projets Portfolio"
    label_singular: "Projet"
    files:
      - label: "Tous les projets"
        name: "all_projets"
        file: "projects.json"
        fields:
          - label: "Projets"
            name: "projets"
            widget: "list"
            label_singular: "Projet"
            summary: "{{fields.titre}} — {{fields.categorie}} ({{fields.annee}})"
            fields:
              - { label: "Slug (identifiant unique, pas d'espaces)", name: "slug", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options:
                  - { label: "Branding", value: "branding" }
                  - { label: "Print", value: "print" }
                  - { label: "Motion Design", value: "motion" }
                  - { label: "Illustration", value: "illustration" }
                  - { label: "Réseaux sociaux", value: "social" }
                  - { label: "Packaging", value: "packaging" }
              - { label: "Description courte", name: "description", widget: "text" }
              - { label: "Image principale", name: "image", widget: "image" }
              - { label: "Client", name: "client", widget: "string", required: false }
              - { label: "Année", name: "annee", widget: "number", default: 2025 }
              - { label: "Durée", name: "duree", widget: "string", required: false }
              - label: "Outils / Technologies"
                name: "outils"
                widget: "list"
                required: false
                field: { label: "Outil", name: "outil", widget: "string" }
              - { label: "Résultat clé", name: "resultat", widget: "string", required: false }
              - { label: "Lien (si en ligne)", name: "lien", widget: "string", required: false, default: "" }
              - { label: "Publié", name: "publie", widget: "boolean", default: true }

  # ============================================
  # ÉQUIPE — reste en fichiers Markdown séparés
  # ============================================
  - name: "equipe"
    label: "Équipe"
    label_singular: "Membre"
    folder: "_equipe"
    create: true
    slug: "{{slug}}"
    identifier_field: nom
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Rôle", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Biographie", name: "bio", widget: "text" }
      - label: "Compétences"
        name: "competences"
        widget: "list"
        field: { label: "Compétence", name: "comp", widget: "string" }
      - { label: "Est fondateur ?", name: "fondateur", widget: "boolean", default: false }
      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Ordre", name: "ordre", widget: "number", default: 1 }

  # ============================================
  # TÉMOIGNAGES — reste en fichiers Markdown séparés
  # ============================================
  - name: "temoignages"
    label: "Témoignages"
    label_singular: "Témoignage"
    folder: "_temoignages"
    create: true
    slug: "{{slug}}"
    identifier_field: nom
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Rôle / Entreprise", name: "role", widget: "string" }
      - { label: "Citation", name: "citation", widget: "text" }
      - { label: "Note (1-5)", name: "note", widget: "number", default: 5, min: 1, max: 5 }
      - { label: "Mis en avant ?", name: "featured", widget: "boolean", default: false }
      - { label: "Publié", name: "publie", widget: "boolean", default: true }

  # ============================================
  # PARAMÈTRES GÉNÉRAUX
  # ============================================
  - name: "parametres"
    label: "Paramètres"
    files:
      - label: "Infos générales"
        name: "general"
        file: "_data/general.yml"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Adresse", name: "adresse", widget: "string" }
          - { label: "Horaires", name: "horaires", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
